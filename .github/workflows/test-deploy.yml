name: Test & Deploy

on:
    push:
        tags:
            - "*"

jobs:
    upload-windows:
        strategy:
            fail-fast: false
            matrix:
                config:
                    # node-gyp bundled with node <= 14 does not support windows-2022
                    - { node-version: 24, npm-version: 11 }
        runs-on: windows-2022
        steps:
            - uses: actions/checkout@master
              with:
                  fetch-depth: 1
            - name: Force Python 3.10 (newer versions do not work with node-gyp version bundled with node v12)
              uses: actions/setup-python@v2
              with:
                  python-version: "3.10"
            - uses: actions/setup-node@v2
              with:
                  node-version: ${{ matrix.config.node-version }}
                  registry-url: https://registry.npmjs.org

            - name: Package prebuilt binary
              run: |
                  npm install -g npm@${{ matrix.config.npm-version }}
                  npm config delete msvs_version --global
                  npm config set msvs_version 2022 --global
                  npm config set progress false
                  npm install --build-from-source
                  npm run package 2>&1
                  npm run tsc
                  npm run test
            - name: Upload release binary
              uses: alexellis/upload-assets@0.3.0
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  asset_paths: '["./build/stage/libxmljs/libxmljs/releases/download/**/*.tar.gz"]'

    upload-linux-newer:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                config:
                    - { node-version: 24 }
                container-image: [x86_64]
        container:
            image: quay.io/pypa/manylinux_2_28_${{ matrix.container-image }}
            env:
                PATH: /opt/python/cp36-cp36m/bin:/opt/python/cp37-cp37m/bin:/opt/python/cp38-cp38/bin:/opt/rh/devtoolset-2/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/python/cp35-cp35m/bin:/opt/python/cp36-cp36m/bin:/opt/python/cp37-cp37m/bin:/opt/python/cp38-cp38/bin:/opt/python/cp39-cp39/bin:/opt/rh/devtoolset-8/root/usr/bin
            options: --user root
        steps:
            - uses: actions/checkout@v3
              with:
                  persist-credentials: false
                  submodules: true
            - name: Point node-gyp at Python
              run: |
                  echo "PYTHON=/opt/python/cp310-cp310/bin/python3" >> "$GITHUB_ENV"
                  echo "npm_config_python=/opt/python/cp310-cp310/bin/python3" >> "$GITHUB_ENV"
                  echo "pythonLocation=/opt/python/cp310-cp310" >> "$GITHUB_ENV"
                  
            - run: |
                  which python3 || true
                  /opt/python/cp310-cp310/bin/python3 --version || true
                  echo "pythonLocation=$pythonLocation"
                  ls -la "$pythonLocation/bin" | head
                  
            - name: Use Node.js ${{ matrix.config.node-version }}
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.config.node-version }}
                  cache: "npm"
            - name: Install and configure newer GCC
              run: |
                  yum install -y gcc-toolset-12-gcc-c++ make
                  echo "CC=/opt/rh/gcc-toolset-12/root/usr/bin/gcc" >> "$GITHUB_ENV"
                  echo "CXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++" >> "$GITHUB_ENV"
                  
            - run: $CXX --version
            - run: npm ci --build-from-source
            - run: npm run package 2>&1
            - run: npm run tsc
            - run: npm run test
            - name: Upload release binary
              uses: alexellis/upload-assets@0.3.0
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  asset_paths: '["./build/stage/libxmljs/libxmljs/releases/download/**/*.tar.gz"]'
